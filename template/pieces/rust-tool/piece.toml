id = "rust-tool"
description = "A Rust crate in a Cargo workspace, orchestrated by Turborepo (clippy, rustfmt, nextest)"
multiple = true
requires = ["base"]
target = "crates/{{ name }}"

[vars]
name = { prompt = "crate name", default = "tool", pattern = "^[a-z][a-z0-9-]*$" }

[files]
owned = ["turbo.json", "AGENTS.md"]
shared = ["Cargo.toml", "package.json"]
seed = ["src/main.rs", "CLAUDE.md"]

[merge]
"Cargo.toml" = "toml"
"package.json" = "json"

[[post]]
# Chained, not a separate post: splice ran an identical command (base's) only once.
run = "cargo generate-lockfile && node scripts/licenses.mjs"
when = ["new"]

[[post]]
# `|| true`: without node_modules the script says what to run; CI's check catches it.
run = "cargo update --workspace && { node scripts/licenses.mjs || true; }"
when = ["add"]
