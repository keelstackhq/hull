id = "preact-app"
description = "Preact client app built with Vite+, cascivo components, deployed to Cloudflare static assets"
multiple = true
requires = ["base"]
target = "apps/{{ name }}"

[vars]
name = { prompt = "app name", default = "web", pattern = "^[a-z][a-z0-9-]*$" }

[files]
owned = ["vite.config.ts", "tsconfig.json", "CLAUDE.md"]
shared = ["package.json", "wrangler.jsonc"]
seed = ["src/**", "index.html"]

[merge]
"package.json" = "json"
"wrangler.jsonc" = "text"
