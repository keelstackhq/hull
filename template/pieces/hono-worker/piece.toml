id = "hono-worker"
description = "Hono on Cloudflare Workers with JSON request logs, Workers Logs observability and optional Sentry"
multiple = true
requires = ["base"]
target = "apps/{{ name }}"

[vars]
name = { prompt = "worker name", default = "api", pattern = "^[a-z][a-z0-9-]*$" }

[files]
owned = ["tsconfig.json", "AGENTS.md", "src/hull/**"]
shared = ["package.json", "wrangler.jsonc"]
seed = ["src/index.ts", "src/index.test.ts", "CLAUDE.md"]

[merge]
"package.json" = "json"
"wrangler.jsonc" = "text"
