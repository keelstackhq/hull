# Checked by the package `lint` script: `cargo deny check bans licenses sources`.
# Advisories are configured here but checked only in release.yml, so a new advisory never fails an
# unrelated pull request.

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
# The allow-list is the policy, not a list of what is used today.
unused-allowed-license = "allow"
# Workspace crates have no license field.
private = { ignore = true }

[bans]
multiple-versions = "allow"
# rustls only: no OpenSSL anywhere in the dependency tree.
deny = [{ crate = "openssl" }, { crate = "openssl-sys" }, { crate = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
