name: preview

# Build only: no secrets, no environment. preview-deploy.yml deploys the artifact.
on:
  pull_request:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Any deployable app?
        id: detect
        run: |
          if compgen -G "apps/*/wrangler.jsonc" > /dev/null; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.deploy == 'true'
      - uses: actions/setup-node@v5
        if: steps.detect.outputs.deploy == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        if: steps.detect.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build affected apps
        if: steps.detect.outputs.deploy == 'true'
        run: pnpm turbo run build --affected
      - name: Pack preview artifact
        if: steps.detect.outputs.deploy == 'true'
        run: node .github/scripts/preview.mjs build
      - uses: actions/upload-artifact@v5
        if: steps.detect.outputs.deploy == 'true'
        with:
          name: preview-${{ github.event.pull_request.number }}
          path: .preview
          retention-days: 3
          if-no-files-found: error
