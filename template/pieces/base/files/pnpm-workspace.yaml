packages:
  - apps/*
  - packages/*
  - crates/*

catalog:
  "@arethetypeswrong/cli": 0.18.5
  "@astrojs/preact": 6.0.6
  "@cascivo/react": 1.9.0
  "@cascivo/themes": 1.0.3
  "@cloudflare/workers-types": 5.20261014.1
  "@preact/preset-vite": 2.10.6
  "@preact/signals-react": 3.12.0
  "@sentry/cloudflare": 11.7.0
  "@storybook/addon-docs": 10.6.2
  "@storybook/preact-vite": 10.6.2
  "@tauri-apps/api": 2.12.3
  "@tauri-apps/cli": 2.12.2
  "@types/node": 24.19.2
  astro: 7.3.8
  docspack: 1.5.0
  happy-dom: 20.14.6
  hono: 4.13.13
  preact: 10.29.8
  publint: 0.3.25
  react: 19.3.0
  react-dom: 19.3.0
  storybook: 10.6.2
  turbo: 2.11.8
  typescript: 7.0.2
  vite-plus: 1.1.0
  wrangler: 4.151.0

overrides:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0

peerDependencyRules:
  allowedVersions:
    storybook>vite-plus: "1"
    vite: "1"
  # @cascivo/react peers on @types/react >=18; it is not installed, typecheck maps react to
  # preact/compat through tsconfig paths.
  ignoreMissing:
    - "@types/react"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAge: 4320

# A pin younger than 3 days at render time needs an exact `name@version` entry under
# `minimumReleaseAgeExclude` (never a range), dropped once the version is 3 days old.
