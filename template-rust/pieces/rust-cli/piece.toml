id = "rust-cli"
description = "A production Rust CLI crate: one JSON object per run, fixed exit codes, released through hoist"
multiple = true
requires = ["base"]
target = "crates/{{ name }}"

[vars]
name = { prompt = "crate and binary name", default = "cli", pattern = "^[a-z][a-z0-9-]*$" }

[files]
owned = ["AGENTS.md"]
shared = ["Cargo.toml"]
seed = ["src/**", "tests/**", "CLAUDE.md", "hoist.toml"]

[merge]
"Cargo.toml" = "toml"

[[post]]
# Chained: Cargo.lock changes after base's licenses post may have run.
run = "cargo update --workspace && node scripts/licenses.mjs"
when = ["add"]
