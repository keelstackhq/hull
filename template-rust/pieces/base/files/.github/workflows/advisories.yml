name: advisories

# Weekly RustSec scan (D-007: crons at most weekly; PR CI checks advisories on every PR). The job stays green on findings and keeps one open issue current;
# it fails only when updating the issue fails. No secrets beyond github.token.
on:
  schedule:
    - cron: "17 5 * * 2"
  workflow_dispatch:

concurrency:
  group: advisories
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: pins
        run: node scripts/pins.mjs --github-output >> "$GITHUB_OUTPUT"
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@${{ steps.pins.outputs.cargo_deny }}
      - id: scan
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/deny.mjs --locked check advisories 2>&1 | tee "$RUNNER_TEMP/advisories.txt"
      - name: Open, update or close the advisory issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ADVISORY_OK: ${{ steps.scan.outcome == 'success' }}
          ADVISORY_REPORT: ${{ runner.temp }}/advisories.txt
        run: node .github/scripts/advisory-issue.mjs
