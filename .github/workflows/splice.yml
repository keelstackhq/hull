name: splice

# Weekly `splice update --all` (template + channels such as org decisions). Opens or refreshes
# one PR on `splice/update`. Without SPLICE_BOT_TOKEN, github.token is used and its PRs get no CI.
on:
  schedule: [{ cron: "17 6 * * 1" }]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: keelstackhq/splice/action@v1
        with:
          scope: all
          token: ${{ secrets.SPLICE_BOT_TOKEN || github.token }}
