name: desktop

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Render the desktop combo
        run: |
          args=$(node -e 'import("./scripts/lib/combos.mjs").then(({ loadCombos }) => { const { vars, combos } = loadCombos(); const c = combos.find((x) => x.name === "desktop"); process.stdout.write([...c.pieces.map((p) => "--piece " + p), ...Object.entries(vars).map(([k, v]) => "--data " + k + "=" + v)].join(" ")) })')
          node scripts/render.mjs new --template template --out "$RUNNER_TEMP/desktop" $args
      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Bump by hand to the `stable` branch head; `toolchain: stable` is explicit, so a digest bump to master stays safe.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-28
        with:
          toolchain: stable
      - name: Install generated repo
        working-directory: ${{ runner.temp }}/desktop
        run: |
          git init -q
          pnpm install --no-frozen-lockfile
      - name: Build desktop
        working-directory: ${{ runner.temp }}/desktop
        run: pnpm turbo run build:desktop
